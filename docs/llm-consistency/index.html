<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM一貫性・モデル間比較ツール</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #252836;
      --border: #2d3148;
      --text: #e4e6ef;
      --text2: #8b90a0;
      --accent: #5b8ef0;
      --accent2: #7c6cf0;
      --success: #3ecf8e;
      --warning: #f5a623;
      --danger: #f06060;
      --r: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.6;
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 24px 20px; }

    header {
      text-align: center;
      padding: 40px 0 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    header p  { color: var(--text2); font-size: 13px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
      color: var(--text2); margin-bottom: 16px;
    }

    label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; }
    input[type="text"], input[type="password"], select {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); padding: 9px 12px;
      font-size: 13px; font-family: inherit; outline: none; transition: border-color .2s;
    }
    input[type="text"]:focus, input[type="password"]:focus, select:focus { border-color: var(--accent); }
    select { cursor: pointer; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 14px; }

    /* Buttons */
    .btn {
      padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: all .15s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #4a7de0; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost {
      background: transparent; color: var(--text2);
      border: 1px solid var(--border); padding: 6px 12px; font-size: 12px;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* Entry list */
    .models-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .entry-list { margin-bottom: 10px; }
    .entry-row {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; margin-bottom: 6px; overflow: hidden;
    }
    .entry-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 10px; border-bottom: 1px solid var(--border);
    }
    .entry-num { font-size: 11px; font-weight: 700; font-family: monospace; color: var(--text2); }
    .entry-ta {
      width: 100%; background: transparent; border: none; color: var(--text);
      padding: 8px 10px; font-family: 'Monaco','Menlo','Consolas',monospace;
      font-size: 11px; line-height: 1.5; resize: vertical; min-height: 64px;
      outline: none;
    }
    .entry-ta:focus { background: rgba(91,142,240,.04); }
    .btn-rm {
      background: none; border: none; cursor: pointer; color: var(--text2);
      font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 3px;
      transition: color .15s;
    }
    .btn-rm:hover { color: var(--danger); }
    .entry-footer {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      margin-top: 4px;
    }
    .entry-count { font-size: 11px; color: var(--text2); margin-left: auto; }

    /* Tabs */
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab {
      padding: 10px 22px; font-size: 13px; font-weight: 500;
      color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: all .15s; user-select: none;
    }
    .tab:hover:not(.active) { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Heatmap */
    .hm-wrap { overflow-x: auto; padding-bottom: 4px; }
    .hm-grid {
      display: inline-grid; gap: 2px;
      padding: 8px; background: var(--surface2);
      border-radius: 6px; border: 1px solid var(--border);
    }
    .hm-cell {
      border-radius: 3px; display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 600; font-family: monospace;
      cursor: default; transition: transform .1s; position: relative;
    }
    .hm-cell:hover { transform: scale(1.12); z-index: 2; }
    .hm-lbl {
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; font-family: monospace;
    }

    /* Stats */
    .stats-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
    .stats-single { margin-top: 18px; }
    .stats-group-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 8px;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 11px; text-align: center;
    }
    .stat-val { font-size: 18px; font-weight: 700; }
    .stat-lbl { font-size: 10px; color: var(--text2); margin-top: 3px; line-height: 1.3; }

    /* Comparison */
    .cmp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
    .cmp-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 20px; text-align: center;
    }
    .cmp-val { font-size: 30px; font-weight: 700; }
    .cmp-lbl { font-size: 12px; color: var(--text2); margin-top: 5px; line-height: 1.4; }

    .sig-badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 11px; font-weight: 700;
    }
    .sig-yes { background: rgba(62,207,142,.15); color: var(--success); border: 1px solid rgba(62,207,142,.3); }
    .sig-no  { background: rgba(139,144,160,.15); color: var(--text2); border: 1px solid var(--border); }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .chart-wrap { position: relative; max-width: 560px; margin: 0 auto; }

    /* Badges */
    .badge {
      padding: 2px 9px; border-radius: 10px;
      font-size: 10px; font-weight: 700; letter-spacing: .04em;
    }
    .badge-a { background: rgba(91,142,240,.15); color: var(--accent); border: 1px solid rgba(91,142,240,.3); }
    .badge-b { background: rgba(124,108,240,.15); color: var(--accent2); border: 1px solid rgba(124,108,240,.3); }

    /* Key chips */
    .key-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .key-chip {
      padding: 3px 9px; border-radius: 10px; background: var(--surface2);
      border: 1px solid var(--border); font-size: 11px; font-family: monospace;
      cursor: pointer; color: var(--text2); transition: all .15s; user-select: none;
    }
    .key-chip:hover { border-color: var(--accent); color: var(--accent); }
    .key-chip.sel { background: rgba(91,142,240,.12); border-color: var(--accent); color: var(--accent); }

    /* Options card */
    .option-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
    }
    .option-row input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }

    /* Progress */
    .progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 10px; }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px; transition: width .25s ease;
    }

    /* Status */
    .status { padding: 11px 15px; border-radius: 6px; font-size: 13px; margin: 10px 0; }
    .status-info    { background: rgba(91,142,240,.1);  border: 1px solid rgba(91,142,240,.3);  color: var(--accent); }
    .status-success { background: rgba(62,207,142,.1);  border: 1px solid rgba(62,207,142,.3);  color: var(--success); }
    .status-error   { background: rgba(240,96,96,.1);   border: 1px solid rgba(240,96,96,.3);   color: var(--danger); }
    .status-warn    { background: rgba(245,166,35,.1);  border: 1px solid rgba(245,166,35,.3);  color: var(--warning); }

    /* Legend */
    .legend-bar { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 10px; color: var(--text2); }
    .legend-gradient { display: flex; gap: 1px; border-radius: 3px; overflow: hidden; }
    .legend-swatch { width: 18px; height: 10px; }

    .separator { height: 1px; background: var(--border); margin: 22px 0; }
    .no-data { text-align: center; padding: 40px; color: var(--text2); font-size: 13px; }
    .hidden { display: none !important; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 800px) {
      .form-row, .models-grid, .two-col, .cmp-grid, .stats-pair { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>LLM出力一貫性・モデル間比較ツール</h1>
    <p>ゴールデンデータセット不要 — OpenAI Embedding API でモデル冪等性とモデル間差異を定量評価</p>
  </header>

  <!-- Config -->
  <div class="card">
    <div class="card-title">設定</div>
    <div class="form-row">
      <div class="form-group">
        <label for="apiKey">OpenAI API キー</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
        <div style="font-size:11px;color:var(--text2);margin-top:4px;">
          メモリ上にのみ保持。OpenAI embedding API へのリクエスト以外には送信しません。
        </div>
      </div>
      <div class="form-group">
        <label for="embModel">Embedding モデル</label>
        <select id="embModel">
          <option value="text-embedding-3-small">text-embedding-3-small（推奨・低コスト）</option>
          <option value="text-embedding-3-large">text-embedding-3-large（高精度）</option>
          <option value="text-embedding-ada-002">text-embedding-ada-002（レガシー）</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="embKeys">
          Embedding 対象キー
          <span style="font-weight:400;color:var(--text2);">（カンマ区切り・ドット記法可）</span>
        </label>
        <input type="text" id="embKeys" placeholder="例: content, result.text, tags">
        <div id="keySuggestions" class="key-chips"></div>
      </div>
      <div class="form-group">
        <label for="distKeys">
          分布分析キー
          <span style="font-weight:400;color:var(--text2);">（省略時：自動検出）</span>
        </label>
        <input type="text" id="distKeys" placeholder="例: category, score, label">
      </div>
    </div>
  </div>

  <!-- Model inputs -->
  <div class="models-grid">
    <!-- Group A -->
    <div class="card">
      <div class="card-title"><span class="badge badge-a">GROUP A</span></div>
      <div class="form-group">
        <label for="nameA">グループ名</label>
        <input type="text" id="nameA" value="Model A" placeholder="例: gpt-4o">
      </div>
      <div id="listA" class="entry-list"></div>
      <div class="entry-footer">
        <button class="btn btn-ghost" onclick="addEntry('A')">+ 追加</button>
        <label class="btn btn-ghost" style="cursor:pointer;">
          <input type="file" style="display:none" accept=".json,.jsonl,.txt" onchange="bulkImport('A',this)">
          一括インポート
        </label>
        <span class="entry-count" id="countA">0 件</span>
      </div>
    </div>

    <!-- Group B -->
    <div class="card">
      <div class="card-title">
        <span class="badge badge-b">GROUP B</span>
        <span style="font-size:11px;color:var(--text2);margin-left:8px;font-weight:400;">（省略可）</span>
      </div>
      <div class="form-group">
        <label for="nameB">グループ名</label>
        <input type="text" id="nameB" value="Model B" placeholder="例: gpt-4o-mini">
      </div>
      <div id="listB" class="entry-list"></div>
      <div class="entry-footer">
        <button class="btn btn-ghost" onclick="addEntry('B')">+ 追加</button>
        <label class="btn btn-ghost" style="cursor:pointer;">
          <input type="file" style="display:none" accept=".json,.jsonl,.txt" onchange="bulkImport('B',this)">
          一括インポート
        </label>
        <span class="entry-count" id="countB">0 件</span>
      </div>
    </div>
  </div>

  <!-- Options -->
  <div class="card">
    <div class="card-title">分析オプション</div>
    <label class="option-row">
      <input type="checkbox" id="doMW">
      <span>
        A・B 間の Mann-Whitney U 検定を実施する
        <span style="color:var(--text2);font-size:12px;">（各グループに 2 件以上必要）</span>
      </span>
    </label>
  </div>

  <!-- Run -->
  <div style="text-align:center; margin:24px 0 18px;">
    <button class="btn btn-primary" id="runBtn" onclick="runAnalysis()" style="padding:13px 44px;font-size:15px;">
      分析実行
    </button>
    <div id="progWrap" class="hidden" style="max-width:480px;margin:14px auto 0;">
      <div id="progText" style="font-size:12px;color:var(--text2);margin-bottom:5px;"></div>
      <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    </div>
  </div>

  <div id="globalMsg"></div>

  <!-- Results -->
  <div id="results" class="hidden">
    <div class="tabs">
      <div class="tab active" data-tab="stability" onclick="switchTab(this)">安定性（複合）</div>
      <div class="tab" data-tab="comparison" onclick="switchTab(this)">モデル間比較</div>
      <div class="tab" data-tab="distribution" onclick="switchTab(this)">分布分析</div>
    </div>

    <!-- Stability -->
    <div id="tab-stability" class="tab-content active">
      <div class="hm-wrap">
        <div id="hmGrid" class="hm-grid"></div>
      </div>
      <div id="hmLegend" class="legend-bar"></div>
      <div id="groupStats"></div>
    </div>

    <!-- Comparison -->
    <div id="tab-comparison" class="tab-content">
      <div id="cmpContent"></div>
    </div>

    <!-- Distribution -->
    <div id="tab-distribution" class="tab-content">
      <div id="distContainer"></div>
    </div>
  </div>

</div>
<script>
// ─── Utilities ────────────────────────────────────────────────────────────────

function deepGet(obj, path) {
  let cur = obj;
  for (const k of path.trim().split('.')) {
    if (cur == null || typeof cur !== 'object') return undefined;
    cur = cur[k];
  }
  return cur;
}

function flatStr(val) {
  if (val == null) return '';
  if (Array.isArray(val)) return val.map(flatStr).join(' ');
  if (typeof val === 'object') return Object.values(val).map(flatStr).join(' ');
  return String(val);
}

function extractText(obj, keys) {
  return keys.map(k => flatStr(deepGet(obj, k))).join(' ').trim();
}

function parseInputs(text) {
  text = text.trim();
  if (!text) throw new Error('入力が空です');
  if (text.startsWith('[')) {
    const arr = JSON.parse(text);
    if (!Array.isArray(arr) || !arr.length) throw new Error('空または無効な JSON 配列');
    return arr;
  }
  const results = [];
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (!t) continue;
    try { results.push(JSON.parse(t)); } catch {}
  }
  if (results.length > 0) return results;
  return [JSON.parse(text)];
}

function cosSim(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
  const d = Math.sqrt(na) * Math.sqrt(nb);
  return d === 0 ? 0 : dot / d;
}

function simMatrix(embs) {
  const n = embs.length;
  return Array.from({length:n}, (_,i) => Array.from({length:n}, (_,j) => cosSim(embs[i], embs[j])));
}

function subStats(mat, r0, r1, c0, c1) {
  const vals = [];
  for (let i = r0; i < r1; i++)
    for (let j = c0; j < c1; j++)
      if (i !== j) vals.push(mat[i][j]);
  if (!vals.length) return null;
  const mean = vals.reduce((s,v)=>s+v,0)/vals.length;
  const min  = Math.min(...vals);
  const max  = Math.max(...vals);
  const vari = vals.reduce((s,v)=>s+(v-mean)**2,0)/vals.length;
  return { mean, min, max, std: Math.sqrt(vari), variance: vari, vals };
}

function centroid(embs) {
  const dim = embs[0].length;
  const c = new Float64Array(dim);
  for (const e of embs) for (let i=0;i<dim;i++) c[i]+=e[i];
  for (let i=0;i<dim;i++) c[i]/=embs.length;
  return Array.from(c);
}

function erf(x) {
  const s = x>=0?1:-1; x=Math.abs(x);
  const t = 1/(1+.3275911*x);
  const y = 1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);
  return s*y;
}
function normalCDF(x) { return .5*(1+erf(x/Math.SQRT2)); }

function mannWhitneyU(g1, g2) {
  const n1=g1.length, n2=g2.length;
  const all=[...g1.map(v=>({v,g:1})),...g2.map(v=>({v,g:2}))].sort((a,b)=>a.v-b.v);
  const ranks=new Array(all.length);
  let i=0;
  while(i<all.length){
    let j=i;
    while(j<all.length-1&&all[j].v===all[j+1].v)j++;
    const avg=(i+j)/2+1;
    for(let k=i;k<=j;k++)ranks[k]=avg;
    i=j+1;
  }
  let R1=0;
  for(let k=0;k<all.length;k++) if(all[k].g===1)R1+=ranks[k];
  const U1=R1-n1*(n1+1)/2, U2=n1*n2-U1, U=Math.min(U1,U2);
  const mu=n1*n2/2, sigma=Math.sqrt(n1*n2*(n1+n2+1)/12);
  const z=(U-mu)/sigma;
  const p=2*(1-normalCDF(Math.abs(z)));
  return {U,U1,U2,z,p,significant:p<.05};
}

function leafKeys(obj, prefix='') {
  if(!obj||typeof obj!=='object') return [];
  const out=[];
  for(const[k,v] of Object.entries(obj)){
    const fk=prefix?`${prefix}.${k}`:k;
    if(v!==null&&typeof v==='object'&&!Array.isArray(v)) out.push(...leafKeys(v,fk));
    else out.push(fk);
  }
  return out;
}

function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

// ─── API ──────────────────────────────────────────────────────────────────────

async function embed(text, apiKey, model) {
  const r = await fetch('https://api.openai.com/v1/embeddings',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},
    body:JSON.stringify({model,input:text}),
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(`API ${r.status}: ${e.error?.message||r.statusText}`);}
  return (await r.json()).data[0].embedding;
}

// ─── Entry management ─────────────────────────────────────────────────────────

let entryCount = 0;

function addEntry(group, jsonVal) {
  entryCount++;
  const id = `e${group}${entryCount}`;
  const list = document.getElementById('list' + group);

  const row = document.createElement('div');
  row.id = 'row_' + id;
  row.className = 'entry-row';

  const hdr = document.createElement('div');
  hdr.className = 'entry-header';

  const num = document.createElement('span');
  num.className = 'entry-num';

  const rm = document.createElement('button');
  rm.className = 'btn-rm';
  rm.title = '削除';
  rm.textContent = '×';
  rm.onclick = () => { row.remove(); updateCount(group); };

  hdr.appendChild(num);
  hdr.appendChild(rm);

  const ta = document.createElement('textarea');
  ta.id = 'ta_' + id;
  ta.className = 'entry-ta';
  ta.placeholder = '{"key": "value", ...}';
  if (jsonVal != null)
    ta.value = typeof jsonVal === 'string' ? jsonVal : JSON.stringify(jsonVal, null, 2);
  ta.addEventListener('input', debouncedDetect);

  row.appendChild(hdr);
  row.appendChild(ta);
  list.appendChild(row);

  updateCount(group);
  renumber(group);
  return ta;
}

function renumber(group) {
  document.querySelectorAll(`#list${group} .entry-num`).forEach((el, i) => {
    el.textContent = `#${i+1}`;
  });
}

function updateCount(group) {
  const n = document.querySelectorAll(`#list${group} .entry-row`).length;
  document.getElementById('count' + group).textContent = `${n} 件`;
  renumber(group);
}

function getEntryValues(group) {
  return [...document.querySelectorAll(`#list${group} .entry-ta`)]
    .map(ta => ta.value.trim()).filter(Boolean);
}

function bulkImport(group, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      for (const json of parseInputs(e.target.result)) addEntry(group, json);
    } catch(err) {
      setMsg('globalMsg', `ファイル読み込みエラー: ${err.message}`, 'error');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

// ─── Key detection ────────────────────────────────────────────────────────────

function detectKeys() {
  const raw = [...document.querySelectorAll('.entry-ta')].map(t=>t.value.trim()).find(Boolean);
  if (!raw) return;
  try {
    const obj = JSON.parse(raw);
    const keys = leafKeys(obj);
    const sel = document.getElementById('embKeys').value.split(',').map(k=>k.trim()).filter(Boolean);
    document.getElementById('keySuggestions').innerHTML =
      '<span style="font-size:11px;color:var(--text2);margin-right:4px;">検出:</span>' +
      keys.map(k=>`<div class="key-chip${sel.includes(k)?' sel':''}" onclick="toggleKey('${k}',this)">${k}</div>`).join('');
  } catch {}
}
const debouncedDetect = debounce(detectKeys, 500);

function toggleKey(key, el) {
  const inp = document.getElementById('embKeys');
  const keys = inp.value.split(',').map(k=>k.trim()).filter(Boolean);
  const idx = keys.indexOf(key);
  if (idx>=0){keys.splice(idx,1);el.classList.remove('sel');}
  else{keys.push(key);el.classList.add('sel');}
  inp.value = keys.join(', ');
}

// ─── Color scale ──────────────────────────────────────────────────────────────

function simColor(v, lo, hi) {
  const t = hi===lo ? 1 : Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
  const r=Math.round(247-t*239), g=Math.round(251-t*203), b=Math.round(255-t*148);
  return { bg:`rgb(${r},${g},${b})`, text: t>.55?'#fff':'#1a1d27' };
}

function renderLegend(id, lo, hi) {
  const el = document.getElementById(id);
  if (!el) return;
  const steps = 8;
  const sw = Array.from({length:steps+1},(_,k)=>{
    const c=simColor(lo+(hi-lo)*k/steps,lo,hi);
    return `<div class="legend-swatch" style="background:${c.bg}" title="${(lo+(hi-lo)*k/steps).toFixed(3)}"></div>`;
  }).join('');
  el.innerHTML = `<span>${lo.toFixed(3)}</span><div class="legend-gradient">${sw}</div><span>${hi.toFixed(3)}</span>
    <span style="margin-left:8px;">（対角=自己類似度）</span>
    <span style="margin-left:8px;"><span style="color:var(--accent);font-weight:700;">■</span> A　<span style="color:var(--accent2);font-weight:700;">■</span> B</span>`;
}

// ─── Heatmap ──────────────────────────────────────────────────────────────────

function renderHeatmap(mat, nA, nB) {
  const n = nA + nB;
  const container = document.getElementById('hmGrid');
  container.innerHTML = '';

  const CELL = n <= 6 ? 42 : n <= 12 ? 36 : n <= 20 ? 28 : 22;
  const LBL  = 26;

  container.style.gridTemplateColumns = `${LBL}px repeat(${n}, ${CELL}px)`;
  container.style.gridTemplateRows    = `${LBL}px repeat(${n}, ${CELL}px)`;

  // Find range (exclude diagonal)
  let lo=Infinity, hi=-Infinity;
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) if(i!==j){lo=Math.min(lo,mat[i][j]);hi=Math.max(hi,mat[i][j]);}
  if(!isFinite(lo)){lo=0;hi=1;}

  function lbl(idx) { return idx<nA ? `A${idx+1}` : `B${idx-nA+1}`; }
  function lblColor(idx) { return idx<nA ? 'var(--accent)' : 'var(--accent2)'; }

  // Corner
  const corner = document.createElement('div');
  corner.style.width = LBL+'px'; corner.style.height = LBL+'px';
  container.appendChild(corner);

  // Column headers
  for(let j=0;j<n;j++){
    const d = document.createElement('div');
    d.className = 'hm-lbl';
    d.style.cssText = `width:${CELL}px;height:${LBL}px;color:${lblColor(j)};font-size:${CELL<30?'8':'9'}px;
      ${j===nA&&nA>0&&nB>0?'border-left:2px solid rgba(124,108,240,.4);':''}`;
    d.textContent = lbl(j);
    d.title = j<nA ? `Group A, 試行 ${j+1}` : `Group B, 試行 ${j-nA+1}`;
    container.appendChild(d);
  }

  // Rows
  for(let i=0;i<n;i++){
    // Row label
    const rl = document.createElement('div');
    rl.className = 'hm-lbl';
    rl.style.cssText = `width:${LBL}px;height:${CELL}px;color:${lblColor(i)};font-size:${CELL<30?'8':'9'}px;
      ${i===nA&&nA>0&&nB>0?'border-top:2px solid rgba(124,108,240,.4);':''}`;
    rl.textContent = lbl(i);
    rl.title = i<nA ? `Group A, 試行 ${i+1}` : `Group B, 試行 ${i-nA+1}`;
    container.appendChild(rl);

    for(let j=0;j<n;j++){
      const v = mat[i][j];
      const cell = document.createElement('div');
      cell.className = 'hm-cell';
      cell.style.width  = CELL+'px';
      cell.style.height = CELL+'px';
      let extra = '';
      if(j===nA&&nA>0&&nB>0) extra += 'border-left:2px solid rgba(124,108,240,.4);';
      if(i===nA&&nA>0&&nB>0) extra += 'border-top:2px solid rgba(124,108,240,.4);';
      if(i===j){
        cell.style.cssText += `background:#1e2d4e;color:var(--accent);${extra}`;
        cell.textContent = '1.00';
      } else {
        const c = simColor(v,lo,hi);
        cell.style.cssText += `background:${c.bg};color:${c.text};${extra}`;
        cell.textContent = CELL>=28 ? v.toFixed(2) : '';
      }
      const al = lbl(i), bl = lbl(j);
      cell.title = `${al} × ${bl}: ${v.toFixed(4)}`;
      container.appendChild(cell);
    }
  }

  renderLegend('hmLegend', lo, hi);
}

// ─── Stats blocks ─────────────────────────────────────────────────────────────

function statCards(st, color) {
  if(!st) return '<div class="no-data" style="padding:20px;">（2件以上必要）</div>';
  return `<div class="stats-grid">
    <div class="stat-card"><div class="stat-val" style="color:${color}">${st.mean.toFixed(4)}</div><div class="stat-lbl">平均類似度<br>（対角除く）</div></div>
    <div class="stat-card"><div class="stat-val" style="color:${color}">${st.min.toFixed(4)}</div><div class="stat-lbl">最小類似度</div></div>
    <div class="stat-card"><div class="stat-val" style="color:${color}">${st.max.toFixed(4)}</div><div class="stat-lbl">最大類似度</div></div>
    <div class="stat-card"><div class="stat-val" style="color:${color}">${st.std.toFixed(4)}</div><div class="stat-lbl">標準偏差</div></div>
  </div>`;
}

function renderGroupStats(stA, stB, nA, nB, nameA, nameB) {
  const container = document.getElementById('groupStats');
  const showA = nA >= 1;
  const showB = nB >= 1;

  if (showA && showB) {
    container.innerHTML = `<div class="stats-pair">
      <div>
        <div class="stats-group-title" style="color:var(--accent);">${nameA}</div>
        ${statCards(stA,'var(--accent)')}
      </div>
      <div>
        <div class="stats-group-title" style="color:var(--accent2);">${nameB}</div>
        ${statCards(stB,'var(--accent2)')}
      </div>
    </div>`;
  } else if (showA) {
    container.innerHTML = `<div class="stats-single">
      <div class="stats-group-title" style="color:var(--accent);">${nameA}</div>
      ${statCards(stA,'var(--accent)')}
    </div>`;
  } else {
    container.innerHTML = `<div class="stats-single">
      <div class="stats-group-title" style="color:var(--accent2);">${nameB}</div>
      ${statCards(stB,'var(--accent2)')}
    </div>`;
  }
}

// ─── Charts ───────────────────────────────────────────────────────────────────

const charts = {};
function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

const DK = { color:'#8b90a0', grid:'#2d3148' };

function mkChart(id,type,data,options){
  destroyChart(id);
  const el=document.getElementById(id); if(!el)return;
  charts[id]=new Chart(el.getContext('2d'),{type,data,options});
}

function renderComparison(stA, stB, cSim, mw, nameA, nameB, showMW) {
  const container = document.getElementById('cmpContent');

  let mwHtml = '';
  if (showMW && mw) {
    mwHtml = `
      <div class="cmp-card">
        <div style="font-size:26px;font-weight:700;color:var(--text);margin-bottom:6px;">p = ${mw.p.toFixed(4)}</div>
        <span class="sig-badge ${mw.significant?'sig-yes':'sig-no'}">
          ${mw.significant?'有意差あり (p < 0.05)':'有意差なし (p ≥ 0.05)'}
        </span>
        <div style="font-size:11px;color:var(--text2);margin-top:6px;">U = ${mw.U.toFixed(1)}, z = ${mw.z.toFixed(3)}</div>
        <div class="cmp-lbl">Mann-Whitney U 検定<br><small>（各グループ内類似度分布を比較）</small></div>
      </div>`;
  } else if (showMW && !mw) {
    mwHtml = `<div class="cmp-card"><div style="color:var(--text2);font-size:13px;">各グループに 2 件以上必要</div><div class="cmp-lbl">Mann-Whitney U 検定</div></div>`;
  }

  const betterName = !stA || !stB ? '—'
    : Math.abs(stA.mean - stB.mean) < 0.0001 ? '同等'
    : stA.mean > stB.mean ? nameA : nameB;
  const betterColor = betterName === nameA ? 'var(--accent)' : betterName === nameB ? 'var(--accent2)' : 'var(--text2)';

  container.innerHTML = `
    <div class="cmp-grid" style="${showMW?'':'grid-template-columns: repeat(2, 1fr);'}">
      <div class="cmp-card">
        <div class="cmp-val" style="color:var(--accent)">${cSim.toFixed(4)}</div>
        <div class="cmp-lbl">セントロイド間 cos 類似度<br><small>${nameA} ↔ ${nameB}</small></div>
      </div>
      ${mwHtml}
      <div class="cmp-card">
        <div class="cmp-val" style="font-size:20px;color:${betterColor}">${betterName}</div>
        <div class="cmp-lbl">より一貫性が高いグループ<br><small>（平均類似度で判定）</small></div>
      </div>
    </div>
    <div class="separator"></div>
    <div class="two-col">
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;">分散比較</div>
        <div class="chart-wrap"><canvas id="chartVariance"></canvas></div>
      </div>
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;">類似度ヒストグラム（対角除く）</div>
        <div class="chart-wrap"><canvas id="chartHist"></canvas></div>
      </div>
    </div>`;

  // Render charts on next tick so canvases exist
  setTimeout(() => {
    if (stA && stB) {
      mkChart('chartVariance','bar',{
        labels:['平均類似度','最小類似度','分散 ×100','標準偏差 ×10'],
        datasets:[
          {label:nameA,data:[stA.mean,stA.min,stA.variance*100,stA.std*10],backgroundColor:'rgba(91,142,240,.7)',borderColor:'#5b8ef0',borderWidth:1},
          {label:nameB,data:[stB.mean,stB.min,stB.variance*100,stB.std*10],backgroundColor:'rgba(124,108,240,.7)',borderColor:'#7c6cf0',borderWidth:1},
        ],
      },{
        responsive:true,
        plugins:{legend:{labels:{color:DK.color}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.raw.toFixed(5)}`}}},
        scales:{
          x:{ticks:{color:DK.color},grid:{color:DK.grid}},
          y:{ticks:{color:DK.color},grid:{color:DK.grid},min:0,max:1.05},
        },
      });

      const allVals=[...stA.vals,...stB.vals];
      const lo=Math.min(...allVals), hi=Math.max(...allVals);
      const BINS=20, bSz=(hi-lo)/BINS||.001;
      const hist=vals=>{const c=new Array(BINS).fill(0);for(const v of vals)c[Math.min(Math.floor((v-lo)/bSz),BINS-1)]++;return c;};
      mkChart('chartHist','bar',{
        labels:Array.from({length:BINS},(_,k)=>(lo+(k+.5)*bSz).toFixed(3)),
        datasets:[
          {label:nameA,data:hist(stA.vals),backgroundColor:'rgba(91,142,240,.5)',borderColor:'#5b8ef0',borderWidth:1},
          {label:nameB,data:hist(stB.vals),backgroundColor:'rgba(124,108,240,.5)',borderColor:'#7c6cf0',borderWidth:1},
        ],
      },{
        responsive:true,
        plugins:{legend:{labels:{color:DK.color}}},
        scales:{
          x:{ticks:{color:DK.color,maxRotation:45,font:{size:9}},grid:{color:DK.grid}},
          y:{ticks:{color:DK.color,stepSize:1},grid:{color:DK.grid},min:0},
        },
      });
    }
  }, 0);
}

function renderDistCharts(outsA, outsB, nameA, nameB, keys) {
  const container = document.getElementById('distContainer');
  container.innerHTML = '';
  const first = outsA[0] || outsB[0] || {};
  if (!keys?.length) keys = leafKeys(first);
  let rendered = 0;
  for (const key of keys) {
    const vA = outsA.map(o=>flatStr(deepGet(o,key)));
    const vB = outsB.map(o=>flatStr(deepGet(o,key)));
    const unique = [...new Set([...vA,...vB])].sort();
    if (unique.length > 20) continue;
    rendered++;
    const sec = document.createElement('div');
    sec.style.marginBottom = '28px';
    const ttl = document.createElement('div');
    ttl.style.cssText = 'font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;font-family:monospace;';
    ttl.textContent = `"${key}"`;
    sec.appendChild(ttl);
    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap'; wrap.style.maxWidth = '640px';
    const canvas = document.createElement('canvas');
    const cid = 'dc_'+key.replace(/\W+/g,'_');
    canvas.id = cid; wrap.appendChild(canvas); sec.appendChild(wrap); container.appendChild(sec);
    const cntA={}, cntB={};
    for(const u of unique){cntA[u]=0;cntB[u]=0;}
    for(const v of vA) cntA[v]=(cntA[v]||0)+1;
    for(const v of vB) cntB[v]=(cntB[v]||0)+1;
    destroyChart(cid);
    charts[cid]=new Chart(canvas.getContext('2d'),{
      type:'bar',
      data:{
        labels:unique.map(u=>u||'(空)'),
        datasets:[
          {label:nameA,data:unique.map(u=>cntA[u]||0),backgroundColor:'rgba(91,142,240,.7)',borderColor:'#5b8ef0',borderWidth:1},
          {label:nameB,data:unique.map(u=>cntB[u]||0),backgroundColor:'rgba(124,108,240,.7)',borderColor:'#7c6cf0',borderWidth:1},
        ],
      },
      options:{responsive:true,plugins:{legend:{labels:{color:DK.color}}},
        scales:{x:{ticks:{color:DK.color},grid:{color:DK.grid}},y:{ticks:{color:DK.color,stepSize:1},grid:{color:DK.grid},min:0}}},
    });
  }
  if(!rendered) container.innerHTML='<div class="no-data">分布分析対象のキーがありません（20種類以上のキーは除外）。<br>「分布分析キー」に明示的にキー名を指定してください。</div>';
}

// ─── Main analysis ────────────────────────────────────────────────────────────

function setMsg(id,msg,type){document.getElementById(id).innerHTML=msg?`<div class="status status-${type}">${msg}</div>`:'';}
function setProgress(pct,text){document.getElementById('progFill').style.width=pct+'%';document.getElementById('progText').textContent=text;}
function switchTab(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+el.dataset.tab).classList.add('active');
}

async function runAnalysis() {
  const apiKey  = document.getElementById('apiKey').value.trim();
  const model   = document.getElementById('embModel').value;
  const embKeys = document.getElementById('embKeys').value.split(',').map(k=>k.trim()).filter(Boolean);
  const distKeys= document.getElementById('distKeys').value.split(',').map(k=>k.trim()).filter(Boolean);
  const nameA   = document.getElementById('nameA').value.trim() || 'Model A';
  const nameB   = document.getElementById('nameB').value.trim() || 'Model B';
  const doMW    = document.getElementById('doMW').checked;

  if(!apiKey)           return setMsg('globalMsg','OpenAI API キーを入力してください','error');
  if(!apiKey.startsWith('sk-')) return setMsg('globalMsg','API キーは "sk-" で始まる必要があります','error');
  if(!embKeys.length)   return setMsg('globalMsg','Embedding 対象キーを1つ以上指定してください','error');

  // Parse entries
  const rawA = getEntryValues('A');
  const rawB = getEntryValues('B');
  const nA = rawA.length, nB = rawB.length;

  if(nA + nB < 2) return setMsg('globalMsg','合計で 2 件以上の JSON エントリが必要です','error');

  const outsA = [], outsB = [];
  for(let i=0;i<nA;i++){
    try{ outsA.push(JSON.parse(rawA[i])); }
    catch(e){ return setMsg('globalMsg',`Group A #${i+1} のパースエラー: ${e.message}`,'error'); }
  }
  for(let i=0;i<nB;i++){
    try{ outsB.push(JSON.parse(rawB[i])); }
    catch(e){ return setMsg('globalMsg',`Group B #${i+1} のパースエラー: ${e.message}`,'error'); }
  }

  setMsg('globalMsg','','info');

  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  document.getElementById('progWrap').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');

  const total = nA + nB;
  let done = 0;

  try {
    const embA=[], embB=[];

    for(let i=0;i<nA;i++){
      setProgress(done/total*95, `Group A: embedding ${i+1}/${nA} 取得中…`);
      const txt = extractText(outsA[i], embKeys);
      if(!txt) throw new Error(`Group A #${i+1}: 指定キーからテキストを抽出できませんでした`);
      embA.push(await embed(txt, apiKey, model));
      done++;
    }
    for(let i=0;i<nB;i++){
      setProgress(done/total*95, `Group B: embedding ${i+1}/${nB} 取得中…`);
      const txt = extractText(outsB[i], embKeys);
      if(!txt) throw new Error(`Group B #${i+1}: 指定キーからテキストを抽出できませんでした`);
      embB.push(await embed(txt, apiKey, model));
      done++;
    }

    setProgress(98, '統計計算中…');

    // Combined matrix (A first, then B)
    const allEmbs = [...embA, ...embB];
    const mat = simMatrix(allEmbs);

    // Per-group stats from submatrix
    const stA = nA >= 2 ? subStats(mat, 0,  nA,   0,  nA)  : null;
    const stB = nB >= 2 ? subStats(mat, nA, nA+nB, nA, nA+nB) : null;

    // Centroid analysis (only if both groups exist)
    let cSim = null, mw = null;
    if(nA > 0 && nB > 0){
      const cA = centroid(embA), cB = centroid(embB);
      cSim = cosSim(cA, cB);
      if(doMW && stA && stB) mw = mannWhitneyU(stA.vals, stB.vals);
    }

    // ── Stability tab ──
    renderHeatmap(mat, nA, nB);
    renderGroupStats(stA, stB, nA, nB, nameA, nameB);

    // ── Comparison tab ──
    if(nA > 0 && nB > 0){
      renderComparison(stA, stB, cSim, mw, nameA, nameB, doMW);
    } else {
      document.getElementById('cmpContent').innerHTML =
        '<div class="no-data">Group B にデータを追加すると、モデル間の比較分析が実行されます。</div>';
    }

    // ── Distribution tab ──
    renderDistCharts(outsA, outsB, nameA, nameB, distKeys);

    setProgress(100,'完了');
    document.getElementById('results').classList.remove('hidden');
    document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
    setMsg('globalMsg','✓ 分析が完了しました','success');

  } catch(e) {
    setMsg('globalMsg',`エラー: ${e.message}`,'error');
    console.error(e);
  } finally {
    btn.disabled = false;
    document.getElementById('progWrap').classList.add('hidden');
  }
}
